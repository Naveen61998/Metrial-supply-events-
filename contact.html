<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contact | EventPro Supplies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <nav class="navbar">
      <a class="logo" href="index.html">Event<span>Pro</span></a>
      <div class="nav-links">
        <a href="index.html">Home</a>
        <a href="products.html">Products</a>
        <a href="services.html">Services</a>
        <a class="active" href="contact.html">Contact</a>
      </div>
    </nav>
  </header>

  <main class="section contact-section">
    <div>
      <p class="tagline">CONTACT US</p>
      <h1>Get Your Event Supply Quote</h1>
      <p>Send your requirements and we will get back to you with details.</p>
      <div class="contact-info">
        <p><strong>Phone:</strong> +91 98765 43210</p>
        <p><strong>Email:</strong> info@eventprosupply.com</p>
        <p><strong>Location:</strong> Hyderabad, Telangana</p>
      </div>
    </div>

    <form class="contact-form" action="#" method="post">
      <input type="text" name="name" placeholder="Your Name" required>
      <input type="tel" name="phone" placeholder="Phone Number" required>
      <input type="email" name="email" placeholder="Email Address">
      <input type="text" name="event" placeholder="Event Type">
      <input type="date" name="date" required>
      <textarea name="requirements" rows="6" placeholder="Tell us what materials you need..." required></textarea>
      <button class="btn" type="submit">Send Enquiry</button>
    </form>
  </main>

  <footer><p>© 2026 EventPro Supplies. All rights reserved.</p></footer>
</body>
</html>
